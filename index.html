<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 행정안전부 안전점검 결과 보고서</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-bg { background-color: #0d3b66; color: white; }
        .card-hover:hover { transform: translateY(-3px); transition: transform 0.2s ease-in-out; }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header class="header-bg py-4 mb-4 shadow-sm">
        <div class="container">
            <h1 class="h3 fw-bold">🛡️ 2026 행정안전부 안전점검 결과 보고서</h1>
            <p class="mb-0 text-light">안전정책총괄과 | 장별 카드 검색 및 관련 정책 영상 포털</p>
        </div>
    </header>

    <main class="container mb-5">
        
        <!-- 검색 섹션 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-9 mb-2 mb-md-0">
                        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="검색할 키워드를 입력하세요 (예: 예산, 시정, 권혁수)...">
                    </div>
                    <div class="col-md-3 text-md-end">
                        <span id="resultCount" class="badge bg-secondary fs-6 p-2">결과 5건</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 장 카드 목록 그리드 -->
        <div class="row row-cols-1 row-cols-md-2 g-4 mb-5" id="cardContainer">
            <!-- JavaScript를 통해 동적으로 장 카드가 렌더링됩니다 -->
        </div>

       <!-- 외부 리소스 섹션: YouTube 링크형 카드 대체 -->
<div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">관련 안전정책 브리핑 영상 (외부 리소스)</h5>
    </div>
    <div class="card-body text-center">
        <a href="https://www.youtube.com/watch?v=V2RdUH2qJq8" target="_blank" class="text-decoration-none">
            <div class="position-relative d-inline-block">
                <!-- 유튜브 공식 썸네일 자동 로드 -->
                <img src="https://img.youtube.com/vi/V2RdUH2qJq8/hqdefault.jpg" 
                     alt="행정안전부 집중안전점검 영상 썸네일" 
                     class="img-fluid rounded shadow-sm mb-2" 
                     style="max-width: 500px;">
                <div class="position-absolute top-50 start-50 translate-middle bg-dark bg-opacity-75 text-white px-3 py-2 rounded-pill fw-bold shadow">
                    ▶ YouTube에서 영상 시청하기
                </div>
            </div>
        </a>
        <p class="text-muted small mt-2 mb-0">국민과 함께하는 2026 집중안전점검 및 생활 주변 안전 관리 안내 영상 [클릭 시 새 창 이동]</p>
    </div>
</div>

    </main>

    <!-- 푸터 -->
    <footer class="text-center py-4 text-muted border-top bg-white">
        <p class="mb-0">&copy; 2026 행정안전부 안전관리과. All rights reserved.</p>
    </footer>

    <!-- JavaScript 로직 -->
    <script>
        // 장데이터.json 내용 내장
        const reportData = [
            {
                "장": "1",
                "제목": "개요",
                "본문": "본 보고서는 행정안전부 안전정책총괄과가 2026년 상반기 실시한 종합 안전점검 결과를 정리한 자료다.\n\n총 점검 건수는 450건이며, 지적사항 120건 중 시정 완료율은 85%이다. 예산 집행률은 92%, 총괄책임자는 권혁수 안전정책총괄과장이다."
            },
            {
                "장": "2",
                "제목": "분야별 결과",
                "본문": "분야별 점검은 시설안전·교통안전·재난안전·산업안전 4개 분야로 진행됐다. 분야별 총합은 450건과 일치한다.\n\n지적사항 115건 중 80% 이상이 1분기 내 시정되었으며, 누적 시정 완료율은 85%으로 집계됐다."
            },
            {
                "장": "3",
                "제목": "예산 운용",
                "본문": "상반기 예산 집행률 90%은 전년 동기 대비 5%p 상승한 수치다.\n\n총괄 운영은 권혁수 과장이 직접 주재했고, 분기별 점검회의 5회를 개최했다."
            },
            {
                "장": "4",
                "제목": "향후 계획",
                "본문": "하반기에는 추가 점검 440건을 목표로 추진한다.\n\n상반기 시정 완료율 82% 수준에 머문 일부 지자체는 추가 컨설팅 대상으로 지정한다."
            },
            {
                "장": "5",
                "제목": "결론",
                "본문": "행정안전부 안전정책총괄과는 2026년 상반기 동안 450건의 안전점검을 차질 없이 완료했다. 총괄 책임은 권혁주 과장이 맡았으며, 향후에도 분기별 점검 체계를 강화한다."
            }
        ];

        const searchInput = document.getElementById('searchInput');
        const cardContainer = document.getElementById('cardContainer');
        const resultCount = document.getElementById('resultCount');

        function renderCards(data) {
            cardContainer.innerHTML = '';
            if (data.length === 0) {
                cardContainer.innerHTML = '<div class="col-12 text-center py-4 text-muted">검색 결과가 없습니다.</div>';
                resultCount.textContent = '결과 0건';
                return;
            }

            resultCount.textContent = `결과 ${data.length}건`;

            data.forEach(item => {
                const col = document.createElement('div');
                col.className = 'col';
                col.innerHTML = `
                    <div class="card h-100 shadow-sm card-hover">
                        <div class="card-header bg-light fw-bold text-primary">
                            제 ${item.장} 장 : ${item.제목}
                        </div>
                        <div class="card-body">
                            <p class="card-text text-secondary" style="white-space: pre-line;">${item.본문}</p>
                        </div>
                    </div>
                `;
                cardContainer.appendChild(col);
            });
        }

        // 초기 렌더링
        renderCards(reportData);

        // 실시간 검색 이벤트 리스너
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim().toLowerCase();
            const filtered = reportData.filter(item => 
                item.제목.toLowerCase().includes(keyword) || 
                item.본문.toLowerCase().includes(keyword)
            );
            renderCards(filtered);
        });
    </script>
</body>
</html>
